name: Generate File

on: push

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is needed to diff github.event.before against the pushed commit
          fetch-depth: 0

      - name: Install pandoc (amd64 only)
        run: |
          set -euo pipefail
          wget -qO pandoc.deb "https://github.com/jgm/pandoc/releases/download/3.1.12.1/pandoc-3.1.12.1-1-amd64.deb"
          sudo dpkg -i pandoc.deb
          rm -f pandoc.deb

      # Replaces Ana06/get-changed-files@v2.2.0 (GitHub Comparison REST API is
      # flaky for large diffs: "temporarily unavailable due to heavy server load").
      # A local `git diff` needs no API and cannot hit that error.
      - name: Get changed article files
        id: files
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          # On the very first push of a branch, before is all zeros or unknown:
          # diff against the empty tree instead (everything counts as added).
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE="$(git hash-object -t tree /dev/null)"
          fi
          git diff --name-status "$BEFORE" "$AFTER" -- 'assets/articles/*.md' > /tmp/changes.txt
          cat /tmp/changes.txt

          removed=""
          changed=""
          while IFS=$'\t' read -r status f1 f2; do
            [[ -z "$status" ]] && continue
            case "$status" in
              D*) removed="$removed $(basename "$f1")" ;;
              # A rename removes the old name's entry and regenerates the new one
              R*) removed="$removed $(basename "$f1")"; changed="$changed $f2" ;;
              *)  changed="$changed $f1" ;;
            esac
          done < /tmp/changes.txt

          {
            echo "removed=$(echo $removed | xargs)"
            echo "changed=$(echo $changed | xargs)"
          } >> "$GITHUB_OUTPUT"

      - run: |
          set -euo pipefail
          mv ./assets/articles.json ./
          mv ./assets/categories.json ./
          mv ./assets/categories_file.json ./
          for removed_file in ${{ steps.files.outputs.removed }}; do
            echo "Removed file: ${removed_file}"
            filename=$(basename -- "${removed_file}")
            tmp=$(mktemp)
            jq -r --arg j "$filename" 'del(.[$j])' articles.json > "$tmp" && mv "$tmp" articles.json

            c=$(jq --arg k "$filename" '.[$k]' categories_file.json)
            if [[ $c != null ]]
            then
              # NOT NULL
              d=$(jq -r --arg k "$filename" '.[$k][]' categories_file.json)
              carr=($d)
              for item in "${carr[@]}"
              do
                jq --arg k "$item" --arg v "$filename" '.[$k] -= [$v]' categories.json > "$tmp" && mv "$tmp" categories.json
              done
            fi
            jq -r --arg j "$filename" 'del(.[$j])' categories_file.json > "$tmp" && mv "$tmp" categories_file.json
          done
          for changed_file in ${{ steps.files.outputs.changed }}; do
            echo "Changed file: ${changed_file}"
            filename=$(basename -- "${changed_file}")
            title=$(head -n1 "${changed_file}")
            title=$(echo "${title//#}" | awk '{$1=$1};1' | sed 's/\r$//')

            value=$(pandoc -f markdown -t plain <(sed -n -e '4,10p' "${changed_file}"))
            value="${value//$'\n'/ }"
            arr=($value)
            value="${arr[@]:0:32}"

            tmp=$(mktemp)
            jq -r --arg j "$filename" --arg k "$title" --arg v "$value" '.[$j] = {($k):$v}' articles.json > "$tmp" && mv "$tmp" articles.json

            # Categories
            # Delete From cat-based index (based on saved-data from file-based index)
            c=$(jq --arg k "$filename" '.[$k]' categories_file.json)
            if [[ $c != null ]]
            then
              # NOT NULL
              d=$(jq -r --arg k "$filename" '.[$k][]' categories_file.json)
              carr=($d)
              for item in "${carr[@]}"
              do
                jq --arg k "$item" --arg v "$filename" '.[$k] -= [$v]' categories.json > "$tmp" && mv "$tmp" categories.json
              done
            fi

            # Then Add to cat-based index
            # Together, update file based index in one go.
            c=$(sed -n -e '2p' "${changed_file}" | sed 's/\r$//')
            categories=($c)
            jq --arg k "$filename" '.[$k] = []' categories_file.json > "$tmp" && mv "$tmp" categories_file.json
            for item in "${categories[@]}"
            do
              jq --arg k "$item" --arg v "$filename" '.[$k] += [$v]' categories.json > "$tmp" && mv "$tmp" categories.json
              jq --arg k "$filename" --arg v "$item" '.[$k] += [$v]' categories_file.json > "$tmp" && mv "$tmp" categories_file.json
            done
          done

          # Categories.json, unlike the other two, might have empty array. Remove them.
          tmp=$(mktemp)
          jq 'with_entries(select(.value != []))' categories.json > "$tmp" && mv "$tmp" categories.json

          mv ./articles.json ./assets
          mv ./categories.json ./assets
          mv ./categories_file.json ./assets
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          # When this workflow's own commit triggers a new run, nothing changed:
          # skip instead of failing on an empty commit.
          if git diff --cached --quiet; then
            echo "No changes to the index files; nothing to commit."
          else
            git commit -m "Auto-generated by Github Actions!"
            git push
          fi